  const ctx=c.getContext('2d');
  try{
    await p.page.render({canvasContext:ctx,viewport:v,transform:out!==1?[out,0,0,out,0,0]:null}).promise;
    const tl=document.createElement('div'); tl.className='textLayer'; tl.style.setProperty('--scale-factor',want);
    const tc=await p.page.getTextContent();
    const task=lib.renderTextLayer({textContentSource:tc,container:tl,viewport:v});
    await task.promise;
    p.el.querySelectorAll('canvas,.textLayer,.ph').forEach(x=>x.remove());
    p.el.appendChild(c); p.el.appendChild(tl); p.rendered=want;
  }catch(e){ console.error(e); }
  p.busy=false;
  if(p.rendered!==scale&&p.visible) render(p);
}
function go(n,smooth){
  n=Math.min(Math.max(1,n),pages.length); const p=pages[n-1];
  $('sc').scrollTo({top:p.el.offsetTop-14,behavior:smooth?'smooth':'auto'}); setCurrent(n);
}
function setCurrent(n){ current=n; $('pg').value=n; $('prev').disabled=n<=1; $('next').disabled=n>=pages.length; }
function setScale(s,keep){
  const sc=$('sc'); const rel=keep?(sc.scrollTop/(sc.scrollHeight||1)):0; const relX=sc.scrollLeft/(sc.scrollWidth||1);
  scale=Math.min(Math.max(s,fitScale*0.25),fitScale*6); sizePages();
  if(keep){ sc.scrollTop=rel*sc.scrollHeight; sc.scrollLeft=relX*sc.scrollWidth; }
  pages.filter(p=>p.visible).forEach(render);
}
(async function main(){
  try{
    doc=await open();
    $('pc').textContent=doc.numPages;
    for(let i=1;i<=doc.numPages;i++){
      const page=await doc.getPage(i);
      const el=document.createElement('div'); el.className='page'; el.dataset.n=i; el.setAttribute('aria-label','Halaman '+i);
      el.innerHTML=`<span class="num">Halaman ${i}</span><span class="ph">Memuat halaman ${i}…</span>`;
      $('pages').appendChild(el); pages.push({page,el,rendered:0,visible:false});
    }
    base=pages[0].page.getViewport({scale:1});
    fitScale=Math.max(0.1,($('sc').clientWidth-24)/base.width); scale=fitScale; sizePages();
    io=new IntersectionObserver(es=>{ es.forEach(e=>{ const p=pages[e.target.dataset.n-1]; p.visible=e.isIntersecting; if(e.isIntersecting) render(p); }); },{root:$('sc'),rootMargin:'600px 0px'});
    pages.forEach(p=>io.observe(p.el));
    const t=Math.min(targetPage(),doc.numPages); go(t,false);
    pages[t-1].el.classList.add('target'); setTimeout(()=>pages[t-1].el.classList.remove('target'),2500);
    document.title='Halaman '+t+' · PDF Cascade RPJMD DIY';
  }catch(e){
    $('pages').innerHTML=`<div class="msg"><b>PDF tidak dapat ditampilkan.</b><br>${String(e.message||e)}<br><br>Pastikan file <code>${PDF_FILE}</code>, <code>pdf-data.js</code>, dan folder <code>pdfjs</code> berada di folder yang sama dengan halaman ini. Anda tetap dapat <a href="${PDF_FILE}">membuka atau mengunduh PDF</a>.</div>`;
  }
})();
$('sc').addEventListener('scroll',()=>{
  const sc=$('sc'); const mid=sc.scrollTop+sc.clientHeight/3; let n=1;
  for(const p of pages){ if(p.el.offsetTop<=mid) n=+p.el.dataset.n; else break; }
  if(n!==current) setCurrent(n);
},{passive:true});
$('prev').onclick=()=>go(current-1,true);
$('next').onclick=()=>go(current+1,true);
$('pg').addEventListener('change',()=>go(parseInt($('pg').value,10)||1,true));
$('pg').addEventListener('keydown',e=>{ if(e.key==='Enter') go(parseInt($('pg').value,10)||1,true); });
$('zi').onclick=()=>setScale(scale*1.25,true);
$('zo').onclick=()=>setScale(scale/1.25,true);
$('fit').onclick=()=>{ fitScale=Math.max(0.1,($('sc').clientWidth-24)/base.width); setScale(fitScale,true); };
window.addEventListener('hashchange',()=>go(targetPage(),true));
</script>
</body>
